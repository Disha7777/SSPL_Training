<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProLearn Academy</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

<header class="header">
  <h1 class="header__title">ProLearn Academy</h1>
  <input type="text" class="header__search" placeholder="Search courses..." />
</header>

<main class="container">
  <section class="courses" id="courseList"></section>
</main>

<!-- COURSE DETAILS MODAL -->
<div class="modal hidden" id="courseModal">
  <div class="modal__content">
    <button class="modal__close">&times;</button>

    <h2 id="modalTitle"></h2>
    <p id="modalCategory"></p>
    <p id="modalDescription"></p>

    <ul id="modalDetails"></ul>

    <button id="enrollBtn" class="course__btn">Enroll Now</button>

    <!-- ENROLL FORM (HIDDEN INITIALLY) -->
    <form class="enroll-form hidden">
      <input type="text" placeholder="Full Name" required />
      <input type="email" placeholder="Email Address" required />
      <button type="submit">Confirm Enrollment</button>
    </form>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/app.js"></script>

</body>
</html>
